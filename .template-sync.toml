# Template sync state — maintained with the paul-template-sync skill.
#
# last_synced is the template commit this repo has been reconciled against: every template
# change up to it was adopted, adapted, or deliberately skipped (see [[decision]] / [[ignore]]).
# Advance it only with `template_sync.py record`, in the same PR that lands the sync.

[template]
repo = "https://github.com/happycodelucky/kmp-template"
branch = "main"
last_synced = "3c348be806dced96c5d5a98809f73ff9d8f82f2b"
last_synced_date = "2026-09-27"

# Render map: how template paths and text read in this repo. Generated from the template's
# scripts/init.sh rules; edit it where this repo deliberately differs. Replacements are
# literal and applied in order; path rules are regexes applied in order.
[render]
name = "reachable"
display_name = "Reachable"
framework = "ReachableKit"
group = "com.happycodelucky"
org = "happycodelucky"
repo_name = "reachable-kmp"

[[render.replace]]
from = "__REPO__"
to = "reachable-kmp"

[[render.replace]]
from = "__PROJECT_NAME__"
to = "reachable"

[[render.replace]]
from = "__DISPLAY_NAME__"
to = "Reachable"

[[render.replace]]
from = "__FRAMEWORK__"
to = "ReachableKit"

[[render.replace]]
from = "template.kmp-library"
to = "reachable.kmp-library"

[[render.replace]]
from = "template.publish"
to = "reachable.publish"

[[render.replace]]
from = "LIBRARY_VERSION"
to = "REACHABLE_VERSION"

[[render.replace]]
from = "com.happycodelucky.src.testing"
to = "com.happycodelucky.reachable.testing"

[[render.replace]]
from = "com.happycodelucky.src.example"
to = "com.happycodelucky.reachable.example"

[[render.replace]]
from = "com.happycodelucky.src.cli"
to = "com.happycodelucky.reachable.cli"

[[render.replace]]
from = "com.happycodelucky.src"
to = "com.happycodelucky.reachable"

[[render.replace]]
from = "build:src"
to = "build@@SRCTASK@@"

[[render.replace]]
from = ":src-testing"
to = ":reachable-testing"

[[render.replace]]
from = ":src"
to = ":reachable"

[[render.replace]]
from = "build@@SRCTASK@@"
to = "build:src"

[[render.replace]]
from = "assembleSrcKitXCFramework"
to = "assembleReachableKitXCFramework"

[[render.replace]]
from = "src-testing/build"
to = "reachable-testing/build"

[[render.replace]]
from = "src-testing/api"
to = "reachable-testing/api"

[[render.replace]]
from = "src/build"
to = "reachable/build"

[[render.replace]]
from = "src/api"
to = "reachable/api"

[[render.replace]]
from = "if-no-files-found: warn"
to = "if-no-files-found: error"

[[render.path]]
from = "^src-testing/"
to = "reachable-testing/"

[[render.path]]
from = "^src/"
to = "reachable/"

[[render.path]]
from = "/com/happycodelucky/src(/|$)"
to = "/com/happycodelucky/reachable\\1"

[[render.path]]
from = "^gradle/plugins/src/main/kotlin/template\\."
to = "gradle/plugins/src/main/kotlin/reachable."

# Standing decisions: template paths this repo deliberately does not carry.
[[ignore]]
path = "TEMPLATE.md"
reason = "Template scaffolding, removed at render."

[[ignore]]
path = "scripts/init.sh"
reason = "Template scaffolding, removed at render."

[[ignore]]
path = "scripts/template-manifest.txt"
reason = "Template scaffolding, removed at render."

[[ignore]]
path = "apps/*"
reason = "Sample apps are Reachable-specific (no jvm-cli, own SwiftUI/Compose UIs); only their build-ability is carried (build:samples)."

[[ignore]]
path = "src/src/*"
reason = "The template's placeholder library code (Greeter, Platform.*)."

[[ignore]]
path = "src-testing/src/*"
reason = "The template's placeholder test fakes (FakeGreeter)."

[[ignore]]
path = "src/api/*"
reason = "Placeholder API dumps; this repo's dumps track its own code."

[[ignore]]
path = "src-testing/api/*"
reason = "Placeholder API dumps; this repo's dumps track its own code."

[[ignore]]
path = "README.md"
reason = "Reachable's own README; only structural bits (x-release-version markers) are ported by hand."

[[ignore]]
path = "docs/index.md"
reason = "Reachable's own docs content."

[[ignore]]
path = "docs/getting-started.md"
reason = "Reachable's own docs content."

[[ignore]]
path = "docs/installation.md"
reason = "Reachable's own docs content."

[[ignore]]
path = "docs/concepts/*"
reason = "Reachable's own docs content."

[[ignore]]
path = "docs/recipes/*"
reason = "Reachable's own docs content."

[[ignore]]
path = "docs/platforms/*"
reason = "Reachable's own docs content."

[[ignore]]
path = "docs/assets/*"
reason = "Placeholder .gitkeep."

[[ignore]]
path = "docs/api/*"
reason = "Generated by copyDokkaToDocs; gitignored here."

[[ignore]]
path = "docs/check.py"
reason = "Reachable's check.py is a superset (also requires code in platform pages)."

