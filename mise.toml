# mise — toolchain pins and task surface for the Reachable KMP repo.
# Run `mise install` to provision tools; `mise tasks` to list runnable tasks.
#
# Keep this file in sync with:
#   gradle/libs.versions.toml                 (jdk target, AGP, Kotlin)
#   gradle/wrapper/gradle-wrapper.properties  (distributionUrl)
#
# Single source of truth for non-Gradle build deps. Versions for Kotlin,
# AGP, SKIE, KMMBridge, ktlint-gradle, etc. live in gradle/libs.versions.toml
# (CLAUDE.md §2, §10) — mise must not duplicate them.
#
# Bootstrap on a fresh machine:
#   brew install mise
#   mise trust
#   mise install
#
# Xcode is NOT managed by mise. Install the latest stable Xcode that SKIE
# supports; the CONTRIBUTING.md "Prerequisites" section records the
# current minimum.

[tools]
java        = "temurin-21.0.11+10.0.LTS"   # CLAUDE.md §2 — JDK 21 LTS, Apple Silicon aarch64.
gradle      = "9.6.1"                       # Matches gradle/wrapper/gradle-wrapper.properties.
python      = "3.12.13"                     # docs/requirements.txt mkdocs toolchain.
gh          = "2.94.0"                      # release tooling (scripts/release.sh, workflows).
# Apple-only tools: scoped to macOS so CI's Ubuntu leg can `mise install`.
xcodegen    = { version = "2.45.4", os = ["macos"] }  # apps/ios, apps/macos project.yml → .xcodeproj.
swiftlint   = { version = "0.63.3", os = ["macos"] }  # apps/ios, apps/macos Swift lint.
swiftformat = { version = "0.61.1", os = ["macos"] }  # apps/ios, apps/macos Swift formatter.

# Deliberately NOT pinned here:
#   - kotlin: gradle/libs.versions.toml owns it (CLAUDE.md §2).
#   - cocoapods: forbidden (CLAUDE.md §9, §13).
#   - node: not used in this repo.

# ---------------------------------------------------------------------------
# Tasks. Naming: `domain:action`, colon-separated, lowercase.
# Lowercase ios/macos in task names is fine — these are CLI tokens, not
# source-identifier symbols. The Apple-casing rule (CLAUDE.md §3) still
# applies to file names, types, and comments below.
# ---------------------------------------------------------------------------

# --- check / lint / format -------------------------------------------------

# Both published modules are listed explicitly. Gradle's `check` is
# per-project — `:reachable:check` alone never runs `:reachable-testing`'s
# test suite. The sample app (`:androidApp` at apps/android) is deliberately NOT listed:
# samples are demo scaffolding, excluded from lint and CI by policy (see
# the subprojects block in build.gradle.kts).
[tasks.check]
description = "Run ktlint + detekt + every unit test in both published modules (iOS simulator, macOS, Android host, JVM)."
run = "./gradlew :reachable:check :reachable-testing:check"

[tasks.test]
description = "Alias for `check`."
depends = ["check"]

[tasks."test:jvm"]
description = "JVM unit tests (fastest — no K/N compile), both modules."
run = "./gradlew :reachable:jvmTest :reachable-testing:jvmTest"

[tasks."test:android"]
description = "Android host unit tests, both modules."
run = "./gradlew :reachable:testAndroidHostTest :reachable-testing:testAndroidHostTest"

[tasks."test:ios"]
description = "iOS simulator arm64 tests (boots a simulator), both modules."
run = "./gradlew :reachable:iosSimulatorArm64Test :reachable-testing:iosSimulatorArm64Test"

[tasks."test:macos"]
description = "macOS arm64 tests, both modules."
run = "./gradlew :reachable:macosArm64Test :reachable-testing:macosArm64Test"

[tasks.lint]
description = "ktlint + detekt only (no tests), both published modules."
run = "./gradlew :reachable:ktlintCheck :reachable:detekt :reachable-testing:ktlintCheck :reachable-testing:detekt"

[tasks.format]
description = "ktlint auto-fix, both published modules."
run = "./gradlew :reachable:ktlintFormat :reachable-testing:ktlintFormat"

# --- public API / ABI ------------------------------------------------------
# The committed dumps under <module>/api/ are the reference for the public
# surface across every target. `checkKotlinAbi` already runs as part of `check`
# (and therefore CI) — these are the explicit entry points.

[tasks."api:check"]
description = "Verify the public API/ABI matches the committed dump (also runs inside `check`)."
run = "./gradlew :reachable:checkKotlinAbi :reachable-testing:checkKotlinAbi"

[tasks."api:dump"]
description = "Regenerate the committed public API/ABI dump after an INTENTIONAL public change. Review + commit the api/ diff."
run = "./gradlew :reachable:updateKotlinAbi :reachable-testing:updateKotlinAbi"

[tasks."lint:swift"]
description = "Run swiftlint across the iOS and macOS sample apps."
run = """
swiftlint lint --strict apps/ios
swiftlint lint --strict apps/macos
"""

[tasks."format:swift"]
description = "Run swiftformat across the iOS and macOS sample apps."
run = """
swiftformat apps/ios
swiftformat apps/macos
"""

# --- build -----------------------------------------------------------------

[tasks."build:xcframework"]
description = "Assemble the release ReachableKit.xcframework (all slices — iosArm64, iosSimulatorArm64, macosArm64)."
run = "./gradlew :reachable:assembleReachableKitXCFramework"

[tasks.build]
description = "Alias for `build:xcframework`."
depends = ["build:xcframework"]

[tasks."build:ios"]
description = "Link debug iOS framework slices (device + Apple Silicon simulator)."
run = """
./gradlew :reachable:linkDebugFrameworkIosArm64 \
          :reachable:linkDebugFrameworkIosSimulatorArm64
"""

[tasks."build:macos"]
description = "Link the debug macOS framework slice (Apple Silicon)."
run = "./gradlew :reachable:linkDebugFrameworkMacosArm64"

[tasks."build:android"]
description = "Assemble the Android AAR."
run = "./gradlew :reachable:assemble"

[tasks."build:jvm"]
description = "Assemble the desktop/server JVM jar."
run = "./gradlew :reachable:jvmJar"

[tasks.xcframework]
description = "Alias for `build:xcframework`."
depends = ["build:xcframework"]

[tasks."build:samples"]
description = "Build the Android sample app — `check` never builds it."
# The sample is excluded from lint/check (demo scaffolding, not shipped code),
# but it must still COMPILE: AndroidX AARs impose compileSdk floors
# (aar-metadata minCompileSdk) that only an app build enforces. CI's fast leg
# runs this (LESSONS B-004). The iOS / macOS samples build in Xcode, not here.
run = "./gradlew :androidApp:assembleDebug"

# --- iteration helpers -----------------------------------------------------

[tasks."spm:dev"]
description = "Rebuild the debug ReachableKit.xcframework and point /Package.swift at it (local dev mode)."
# KMMBridge's `spmDevBuild` builds the debug XCFramework and REWRITES the root
# /Package.swift to a `.binaryTarget(path: …)` pointing at the local build, so
# the sample apps pick up local Kotlin edits without Gradle inside Xcode. The
# committed Package.swift on main is always a local-dev form; the released
# remote `.binaryTarget(url:checksum:)` form exists only on each vX.Y.Z tag
# (CLAUDE.md §9, .github/PUBLISHING.md). KMMBridge's rewrite differs from the
# committed file: don't commit it — `mise run spm:restore` restores it.
run = "./gradlew :reachable:spmDevBuild"

[tasks."spm:restore"]
description = "Restore the committed /Package.swift after spm:dev rewrote it."
run = "git restore Package.swift"

[tasks."xcodeproj:ios"]
description = "Generate apps/ios/iOSApp.xcodeproj from project.yml."
dir = "apps/ios"
run = "xcodegen generate --spec project.yml"

[tasks."xcodeproj:macos"]
description = "Generate apps/macos/macOSApp.xcodeproj from project.yml."
dir = "apps/macos"
run = "xcodegen generate --spec project.yml"

[tasks."open:ios"]
description = "spm:dev + xcodegen + open apps/ios in Xcode."
depends = ["spm:dev", "xcodeproj:ios"]
dir = "apps/ios"
run = "open iOSApp.xcodeproj"

[tasks."open:macos"]
description = "spm:dev + xcodegen + open apps/macos in Xcode."
depends = ["spm:dev", "xcodeproj:macos"]
dir = "apps/macos"
run = "open macOSApp.xcodeproj"

[tasks."open:android"]
description = "Open apps/android in Android Studio."
run = "open -a 'Android Studio' ."

# --- docs ------------------------------------------------------------------

[tasks."docs:install"]
description = "Install the pinned mkdocs toolchain into the active python."
run = "pip install -r docs/requirements.txt"

[tasks."docs:dokka"]
description = "Generate Dokka HTML and mirror it into docs/api/."
run = "./gradlew copyDokkaToDocs"

[tasks."docs:check"]
description = "Validate docs structure (nav coverage, recipes have code)."
run = "python3 docs/check.py"

[tasks."docs:serve"]
description = "Local mkdocs preview at http://localhost:8000."
depends = ["docs:dokka"]
run = "mkdocs serve"

[tasks."docs:build"]
description = "Strict mkdocs build — what CI runs."
depends = ["docs:dokka", "docs:check"]
run = "mkdocs build --strict"

[tasks."docs:build:only"]
description = "Strict mkdocs build, assuming docs:dokka + docs:check already ran (CI uses this)."
run = "mkdocs build --strict"

# --- changesets / release notes --------------------------------------------
# Every PR that reaches consumers adds a changeset (.changeset/README.md); the
# Release PR workflow turns the pending ones into the next version + changelog.
# scripts/changeset.py is stdlib-only Python (the python pinned above).

[tasks.changeset]
description = "Add a changeset for this branch (.changeset/<branch>.md). Prompts for title / change / description unless passed as flags."
# raw: the prompts need the terminal. Flags pass straight through, e.g.
#   mise run changeset --title "Add retries" --change minor --description "…"
raw = true
run = "python3 scripts/changeset.py new"

[tasks."changeset:status"]
description = "Pending changesets, the next version they add up to, and a preview of its changelog entry."
run = "python3 scripts/changeset.py status"

[tasks."changeset:scope"]
description = "Which files this branch changes since origin/main, in release scope (.changeset/config.toml) or not — whether the PR needs a changeset."
# Pass paths to classify them instead, or --since REF for another base.
run = "python3 scripts/changeset.py scope"

[tasks."changeset:check"]
description = "Validate every pending changeset — the PR check runs this (plus: the PR must add one)."
run = "python3 scripts/changeset.py check"

# --- publish ---------------------------------------------------------------

[tasks."publish:local"]
description = "Publish both modules to the local Maven repo (~/.m2) as the next -SNAPSHOT (e.g. 0.15.0-SNAPSHOT)."
# Never the plain gradle.properties version: that is the LAST RELEASE, and a
# local build of it in ~/.m2 would shadow the real artifact from Maven Central
# for every local project that lists mavenLocal() first. The version under
# development instead — what the pending changesets add up to, else the next
# patch — as a -SNAPSHOT, which a consumer opts into explicitly.
run = './gradlew publishToMavenLocal -Pversion="$(python3 scripts/changeset.py snapshot)"'

[tasks."publish:maven"]
description = "Release by hand: gradle.properties' version, or --version X.Y.Z-rc.1 for a pre-release; --dryrun stages only. See scripts/release.sh."
# The canonical path is CI: merging the release PR runs
# .github/workflows/release.yml. This is the by-hand equivalent, same rules —
# the version is gradle.properties' (set by the last release PR) unless
# --version names a pre-release. scripts/release.sh orchestrates:
#   --dryrun : publishToMavenCentral (Central STAGING only; nothing committed,
#              tagged, or released). Safe to run repeatedly.
#   (real)   : after a typed confirmation — build the XCFramework, publish +
#              release to Maven Central (IRREVERSIBLE), tag vX.Y.Z on a release
#              commit carrying Package.swift, and `gh release create`.
usage = '''
flag "--version <version>" help="Release this version instead of gradle.properties' — a pre-release like 0.4.0-rc.1."
flag "--dryrun" help="Upload to Central staging only; no release, tag, or commit."
'''
run = '''
ARGS=""
[ "{{flag(name='dryrun')}}" = "true" ] && ARGS="$ARGS --dryrun"
VERSION="{{option(name='version')}}"
[ -n "$VERSION" ] && ARGS="$ARGS --version $VERSION"
sh scripts/release.sh $ARGS
'''

# --- aggregates ------------------------------------------------------------

[tasks.ci]
description = "Run CI's Apple leg locally: check + release XCFramework."
run = "./gradlew :reachable:check :reachable-testing:check :reachable:assembleReachableKitXCFramework"

# --- housekeeping ----------------------------------------------------------

[tasks.clean]
description = "Gradle clean + drop generated xcodeproj bundles."
run = """
./gradlew clean
rm -rf apps/ios/iOSApp.xcodeproj apps/macos/macOSApp.xcodeproj
"""
